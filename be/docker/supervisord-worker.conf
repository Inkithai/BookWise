; BookWise worker container — supervisord
;
; Used by the Render background worker (dockerCommand in render.yaml):
;   supervisord -n -c /etc/supervisord-worker.conf
;
; It runs the queue consumer and Laravel's scheduler side by side in the same
; instance (a starter worker is 0.5 CPU / 512 MB, which is plenty for both).
; supervisord restarts either process if it exits and forwards SIGTERM on
; shutdown so queue:work can finish its current job instead of being killed.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord-worker.pid

[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --timeout=90 --sleep=3 --no-interaction
directory=/var/www/html
user=www-data
priority=10
autostart=true
autorestart=true
startsecs=2
; Keep retrying while the schema finishes migrating (first deploy).
startretries=100
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /var/www/html/artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
