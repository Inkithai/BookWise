# ──────────────────────────────────────────────────────────────────────────
# BookWise — Render Blueprint
#
# Backend (Laravel API) on Render, database on Supabase (external Postgres),
# frontend (Next.js) on Vercel. Import this file via
#   Render → New → Blueprint → pick this repo
# or create the services manually following DEPLOYMENT.md.
#
# Secrets (sync: false) must be filled in the Render dashboard once:
#   APP_KEY, APP_URL, FRONTEND_URL, CORS_ALLOWED_ORIGINS,
#   DB_HOST, DB_USERNAME, DB_PASSWORD,
#   PASSPORT_PRIVATE_KEY, PASSPORT_PUBLIC_KEY,
#   and (optionally) mail / Stripe / Google OAuth credentials.
# ──────────────────────────────────────────────────────────────────────────

services:
  # ── Laravel API ─────────────────────────────────────────────────────────
  - type: web
    name: bookwise-api
    runtime: docker
    root: be
    dockerfilePath: ./Dockerfile
    plan: free # upgrade to "starter" for an always-on instance
    region: singapore # closest Render region to Sri Lanka
    healthCheckPath: /up
    # Runs in a one-off container against the NEW image before traffic
    # switches over — keeps Supabase migrations in sync with each deploy.
    preDeployCommand: php artisan migrate --force
    envVars:
      - key: APP_NAME
        value: BookWise
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Colombo
      - key: APP_KEY # php artisan key:generate (base64:...)
        sync: false
      - key: APP_URL # https://bookwise-api.onrender.com
        sync: false
      - key: FRONTEND_URL # https://<your-app>.vercel.app
        sync: false
      - key: CORS_ALLOWED_ORIGINS # https://<your-app>.vercel.app
        sync: false

      # ── Supabase Postgres (session pooler, port 5432) ──
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST # aws-0-<region>.pooler.supabase.com
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME # postgres.<project-ref>
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── No Redis on Render: use the database driver (tables are migrated) ──
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database

      # ── Laravel Passport signing keys (php artisan passport:keys) ──
      - key: PASSPORT_PRIVATE_KEY
        sync: false
      - key: PASSPORT_PUBLIC_KEY
        sync: false
      - key: TOKEN_LIFETIME
        value: "525600"

      # ── Mail (OTP / notifications). Defaults to log; switch to smtp once
      #    you have a provider (Mailtrap/Brevo/SES/Postmark...). ──
      - key: MAIL_MAILER
        value: log
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@bookwise.lk
      - key: MAIL_FROM_NAME
        value: BookWise

      # ── Stripe (optional until subscriptions go live) ──
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUBSCRIPTION_CURRENCY
        value: LKR

      # ── Google OAuth (optional) ──
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI # https://<your-app>.vercel.app/auth/google/callback
        sync: false

      # ── Misc ──
      - key: LOG_CHANNEL
        value: stderr # streams straight into Render logs
      - key: LOG_LEVEL
        value: warning
      - key: FILESYSTEM_DISK
        value: local
      - key: L5_SWAGGER_GENERATE_ALWAYS
        value: "false"

  # ── Queue worker + scheduler (optional but recommended) ─────────────────
  # Consumes the database queue (OTP/notification mails, Stripe jobs) and
  # runs the schedules in routes/console.php (subscriptions, trials,
  # recurring statements, Clarity fetch).
  # If you stay on a free budget, delete this service and set
  # QUEUE_CONNECTION=sync on the web service (scheduled jobs will not run).
  - type: worker
    name: bookwise-worker
    runtime: docker
    root: be
    dockerfilePath: ./Dockerfile
    plan: starter # Render background workers require a paid instance
    region: singapore
    startCommand: sh -c "php artisan queue:work --tries=3 --timeout=90 & php artisan schedule:work"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: PASSPORT_PRIVATE_KEY
        sync: false
      - key: PASSPORT_PUBLIC_KEY
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_FROM_ADDRESS
        value: noreply@bookwise.lk
      - key: MAIL_FROM_NAME
        value: BookWise
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
